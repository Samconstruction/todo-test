<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SAM To-Do TEST has moved</title>
<style>body{margin:0;font-family:system-ui,sans-serif;background:#EAF7F3;color:#123;display:flex;min-height:100vh;align-items:center;justify-content:center}div{background:#fff;border-radius:16px;padding:28px 22px;max-width:360px;margin:16px;text-align:center;box-shadow:0 2px 10px #0001}a{display:inline-block;margin-top:14px;background:#1B8F7B;color:#fff;text-decoration:none;padding:12px 20px;border-radius:12px;font-weight:600}p{line-height:1.45}</style></head>
<body><div><h2>The test app has moved</h2><p>Please delete this old "SAM To-Do TEST" app from your phone, then open the new address and add it to your home screen.</p><a href="https://samtodo-test.github.io/todo-test/">Open the new test app</a><p style="font-size:13px;color:#567">La app de prueba se mudó. Borre esta app y abra la nueva dirección.</p></div>
<script>if('serviceWorker'in navigator)navigator.serviceWorker.getRegistrations().then(function(r){r.forEach(function(x){if(x.scope.indexOf('/todo-test/')>-1)x.unregister();});});</script></body></html>
